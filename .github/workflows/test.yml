name: test
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # test/tps-compat.test.ts runs the installed senpi's builtin tps extension, found in the bun global
      # layout ~/.bun/install/global/node_modules/@code-yeongyu/senpi that `bun add -g omo-ai` creates.
      - name: install omo engine (omo-ai)
        run: bun add -g omo-ai
      - run: bun run test
